services:
  homestorage:
    build:
      context: .
      dockerfile: Dockerfile
    image: homestorage:local
    pull_policy: build
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      DATA_DIR: /data
      APP_TIMEZONE: Asia/Shanghai
      # 在下面两个引号中填写自己的登录密码，不能留空。
      HOME_STORAGE_PASSWORD: ""
      # 可选：填写供应商的 OpenAI 兼容 API 地址、密钥和模型。
      AI_API_BASE_URL: "https://api.openai.com/v1"
      AI_API_KEY: ""
      AI_MODEL: "gpt-4o-mini"
      # 开启录音转文字时填写该服务支持的语音模型，例如 whisper-1。
      AI_TRANSCRIPTION_MODEL: ""
      # 语音服务可独立配置；留空则使用上面的聊天服务地址和密钥。
      AI_TRANSCRIPTION_BASE_URL: ""
      AI_TRANSCRIPTION_API_KEY: ""
    command:
      - sh
      - -c
      - ': "$${HOME_STORAGE_PASSWORD:?请在Compose中填写HOME_STORAGE_PASSWORD}"; exec uvicorn app.main:app --host 0.0.0.0 --port 8080 --workers 1 --no-proxy-headers'
    volumes:
      - homestorage_data:/data
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  homestorage_data:
    name: homestorage_data
