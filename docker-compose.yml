services:
  homestorage:
    build: .
    image: homestorage:local
    restart: unless-stopped
    ports:
      - "${HOME_STORAGE_PORT:-8080}:8080"
    environment:
      DATA_DIR: /data
      APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Shanghai}
      HOME_STORAGE_PASSWORD: ${HOME_STORAGE_PASSWORD:?请先在 .env 中设置 HOME_STORAGE_PASSWORD}
      AI_API_BASE_URL: ${AI_API_BASE_URL:-https://api.openai.com/v1}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-gpt-4o-mini}
      AI_TRANSCRIPTION_MODEL: ${AI_TRANSCRIPTION_MODEL:-}
      AI_TRANSCRIPTION_BASE_URL: ${AI_TRANSCRIPTION_BASE_URL:-}
      AI_TRANSCRIPTION_API_KEY: ${AI_TRANSCRIPTION_API_KEY:-}
    user: "${PUID:-1000}:${PGID:-1000}"
    volumes:
      - ./data:/data
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
