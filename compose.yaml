services:
  homestorage:
    build: .
    image: homestorage:local
    pull_policy: build
    restart: unless-stopped
    ports:
      - "${HOME_STORAGE_PORT:-8080}:8080"
    environment:
      DATA_DIR: /data
      APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Shanghai}
      HOME_STORAGE_PASSWORD: ${HOME_STORAGE_PASSWORD:?请先在 .env 中设置 HOME_STORAGE_PASSWORD}
      AI_API_BASE_URL: ${AI_API_BASE_URL:-https://api.openai.com/v1}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-gpt-4o-mini}
      AI_TRANSCRIPTION_MODEL: ${AI_TRANSCRIPTION_MODEL:-}
      AI_TRANSCRIPTION_BASE_URL: ${AI_TRANSCRIPTION_BASE_URL:-}
      AI_TRANSCRIPTION_API_KEY: ${AI_TRANSCRIPTION_API_KEY:-}
      UPDATE_SERVICE_URL: http://updater:9080
    user: "${PUID:-1000}:${PGID:-1000}"
    volumes:
      - ./data:/data
      - homestorage_update_state:/run/homestorage-update:ro
    labels:
      io.homestorage.role: app
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  updater:
    labels:
      io.homestorage.role: updater
    image: homestorage:local
    pull_policy: never
    depends_on:
      homestorage:
        condition: service_started
    restart: unless-stopped
    user: "0:0"
    command: ["uvicorn", "updater.main:app", "--host", "0.0.0.0", "--port", "9080", "--workers", "1", "--no-proxy-headers"]
    environment:
      APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Shanghai}
      APP_UID: ${PUID:-1000}
      APP_GID: ${PGID:-1000}
      # 私有仓库可填仅该仓库 Contents:read 的 GitHub token；只交给 updater。
      UPDATE_GITHUB_TOKEN: ${UPDATE_GITHUB_TOKEN:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./data:/app-data
      - homestorage_update_state:/state
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER]
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "from pathlib import Path; import urllib.request; r=urllib.request.Request('http://127.0.0.1:9080/v1/status',headers={'Authorization':'Bearer '+Path('/state/token').read_text().strip()}); urllib.request.urlopen(r,timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  homestorage_update_state:
