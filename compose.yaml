services:
  homestorage:
    build: .
    image: homestorage:local
    restart: unless-stopped
    ports:
      - "${HOME_STORAGE_PORT:-8080}:8080"
    environment:
      DATA_DIR: /data
      APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Shanghai}
      HOME_STORAGE_PASSWORD: ${HOME_STORAGE_PASSWORD:?请先在 .env 中设置 HOME_STORAGE_PASSWORD}
    user: "${PUID:-1000}:${PGID:-1000}"
    volumes:
      - ./data:/data
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
